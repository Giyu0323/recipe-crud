<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipe Cards</title>
  <style>
    :root { --green: #2e7d32; --green-dark: #1b5e20; --red: #c62828; --bg: #f4f7f4; }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 14px 40px;
      color: #222;
    }
    h1 { text-align: center; color: var(--green-dark); }

    form {
      display: grid;
      gap: 10px;
      background: #fff;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      margin-bottom: 24px;
    }
    input, textarea {
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
    }
    input:focus, textarea:focus { outline: 2px solid var(--green); border-color: var(--green); }

    button {
      padding: 9px 16px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: var(--green);
      color: #fff;
    }
    button:hover { background: var(--green-dark); }
    #cancel-btn { background: #777; }

    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    th, td { padding: 10px; text-align: left; vertical-align: top; border-bottom: 1px solid #eee; }
    th { background: var(--green); color: #fff; }
    tr:hover td { background: #f1f8f1; }

    .actions { white-space: nowrap; }
    .actions button { margin-right: 4px; padding: 6px 12px; }
    .actions button:last-child { background: var(--red); }
    .actions button:last-child:hover { background: #8e0000; }
  </style>
</head>
<body>
  <h1>Personal Recipe Cards</h1>

  <form id="recipe-form">
    <input type="hidden" id="recipe-id" />
    <input id="title" placeholder="Title *" required />
    <input id="category" placeholder="Category (e.g. Main, Dessert)" />
    <textarea id="ingredients" placeholder="Ingredients" rows="2"></textarea>
    <textarea id="instructions" placeholder="Instructions" rows="3"></textarea>
    <input id="prep_time_minutes" type="number" min="0" placeholder="Prep time (minutes)" />
    <input id="servings" type="number" min="1" placeholder="Servings" />
    <div>
      <button type="submit" id="save-btn">Add Recipe</button>
      <button type="button" id="cancel-btn" style="display:none">Cancel edit</button>
    </div>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Title</th><th>Category</th><th>Ingredients</th>
          <th>Prep (min)</th><th>Servings</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="recipe-list"></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
